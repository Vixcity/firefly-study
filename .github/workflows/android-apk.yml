name: Android APK

# 推 main 就自动打一个 debug APK，可以在 Actions 页面直接下载、装到手机上。
# 也可以到 Actions 页面手动点「Run workflow」（workflow_dispatch）。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'android/**'
      - 'scripts/generate-icons.mjs'
      - 'scripts/build-apk.mjs'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    name: 打 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 8 的 android 工程编译级别是 Java 21，必须用 21
      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 装 Android 命令行工具
        uses: android-actions/setup-android@v3

      - name: 装编译需要的 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 装依赖
        run: npm ci

      - name: 生成图标（含 Android mipmap）
        run: npm run icons

      - name: 构建 web 产物并同步到 android 工程
        run: npm run android:sync

      # 从 Windows 提交的工程里 gradlew 可能没有可执行位，补一下更保险
      - name: 打 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 记录产物信息
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          echo "### 萤火书房 debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "体积：$(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "提交：\`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: firefly-study-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
